<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trilha - Escrituração e Partidas Dobradas</title>
<style>
:root{--blue:#082656;--blue2:#1557a8;--gold:#ffca28;--green:#13a85b;--red:#d62828;--text:#102033}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(160deg,#06162f,#1557a8);color:var(--text);display:flex;justify-content:center;min-height:100vh} .app{width:100%;max-width:430px;background:#f5f8ff;min-height:100vh;position:relative;box-shadow:0 0 28px #0007} .header{background:linear-gradient(135deg,#061f49,#1557a8);color:white;padding:14px 16px 10px;border-bottom:5px solid var(--gold);position:sticky;top:0;z-index:5} .course{font-size:14px;font-weight:800} .title{font-size:19px;font-weight:900;line-height:1.15;margin-top:4px} .progress{height:9px;background:#ffffff55;border-radius:99px;margin-top:9px;overflow:hidden} .bar{height:100%;width:0;background:var(--gold);transition:.25s} main{padding-bottom:100px} .screen{display:none;padding:18px 16px 14px;animation:fade .2s} .screen.active{display:block} @keyframes fade{from{opacity:.2;transform:translateX(8px)}to{opacity:1;transform:none}} .card{background:white;border-radius:22px;padding:18px;box-shadow:0 8px 22px #08265622;border:1px solid #dbe6ff} .cover{background:linear-gradient(180deg,#fff,#eaf3ff);border:3px solid var(--blue);text-align:center} .emoji{font-size:44px;text-align:center} .h1{font-size:29px;font-weight:900;color:var(--blue);line-height:1.05;margin:10px 0;text-align:center} .h2{font-size:24px;font-weight:900;color:var(--blue);line-height:1.1;margin:0 0 12px} .p{font-size:18px;line-height:1.45;margin:10px 0} .big{font-size:21px;font-weight:900} .box{border-radius:16px;padding:14px;margin:12px 0;font-size:17px;line-height:1.38} .blue{background:#e8f1ff;border-left:7px solid var(--blue2)} .green{background:#e8fff1;border-left:7px solid var(--green)} .red{background:#fff0f0;border-left:7px solid var(--red)} .yellow{background:#fff8dd;border-left:7px solid var(--gold)} .formula{font-family:Consolas,monospace;background:#091b36;color:#fff;border-radius:14px;padding:14px;white-space:pre-wrap;line-height:1.4;font-size:16px;overflow:auto;margin-top:12px} .input{width:100%;padding:15px;border:2px solid #b8c7df;border-radius:14px;font-size:18px;margin:10px 0} button{border:0;border-radius:14px;padding:12px 10px;font-weight:900;font-size:15px;cursor:pointer} .btn{background:var(--blue);color:white} .btn2{background:var(--gold);color:var(--blue)} .btn3{background:#eef3fb;color:var(--blue);border:1px solid #cbd8ee} .full{width:100%;margin-top:8px} .quiz .alt{width:100%;display:block;text-align:left;background:#f3f6fb;border:2px solid #ccd8ee;border-radius:14px;padding:12px;margin:9px 0;font-size:17px;font-weight:800;color:#102033} .quiz .alt.correct{background:#dff7e9;border-color:var(--green)} .quiz .alt.wrong{background:#ffe0e0;border-color:var(--red)} .comment{display:none} .comment.show{display:block} .footer{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:white;border-top:1px solid #d8e3f5;padding:9px 12px 12px;z-index:10} .nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px} .smalltxt{text-align:center;font-size:12px;color:#50627b;margin-top:7px;font-weight:800}
</style>
</head>
<body><div class="app"><div class="header"><div class="course">Curso de Contabilidade Professor Moreira</div><div class="title">Escrituração, Plano de Contas e Partidas Dobradas</div><div class="progress"><div class="bar" id="bar"></div></div></div><main id="slides"></main><div class="footer"><div class="nav"><button class="btn3" onclick="prevSlide()">⬅️ Voltar</button><button class="btn2" onclick="home()">🏠 Início</button><button class="btn" onclick="nextSlide()">Próxima ➡️</button></div><div class="smalltxt" id="counter">Tela 1/50</div></div></div>
<script>
const whatsapp='5561985323574';
const slides=["<div class=\"card cover\"><div class=\"emoji\">🚀</div><div class=\"h1\">Trilha de Aprendizagem</div><p class=\"p big\">Escrituração, Plano de Contas e Partidas Dobradas</p><div class=\"box yellow\">50 telas • 14 questões • linguagem simples</div><input id=\"student\" class=\"input\" placeholder=\"Digite seu nome completo\"><button class=\"btn full\" onclick=\"startCourse()\">Começar agora</button><button class=\"btn3 full\" onclick=\"continueCourse()\">Continuar de onde parei</button></div>", "<div class=\"card\"><div class=\"h2\">🎯 Objetivo da trilha</div><p class=\"p\">Entender como a Contabilidade registra os fatos, organiza as contas e mantém a igualdade entre débitos e créditos.</p><div class=\"box blue\">Plano de Contas → Escrituração → Débito e Crédito → Fatos Contábeis</div></div>", "<div class=\"card\"><div class=\"h2\">📚 Técnicas Contábeis</div><p class=\"p\">A Contabilidade utiliza técnicas para registrar, demonstrar, conferir e interpretar os fatos da entidade.</p><div class=\"box blue\">Escrituração • Demonstrações Contábeis • Auditoria • Análise de Balanços</div></div>", "<div class=\"card\"><div class=\"h2\">🧾 Escrituração</div><p class=\"p\">Escrituração é o registro cronológico e técnico dos fatos contábeis.</p><div class=\"box blue\">Tudo que altera bens, direitos, obrigações, receitas ou despesas deve ser registrado.</div></div>", "<div class=\"card\"><div class=\"h2\">⚖️ ITG 2000</div><p class=\"p\">A ITG 2000 orienta a forma correta de execução da escrituração contábil.</p><div class=\"box blue\">Idioma nacional • Moeda nacional • Forma contábil • Ordem cronológica • Sem rasuras</div></div>", "<div class=\"card\"><div class=\"h2\">🚨 Pegadinha de prova</div><p class=\"p\">A escrituração não depende exclusivamente de documentos externos.</p><div class=\"box blue\">Pode ter base em documentos externos, internos ou elementos que comprovem o fato.</div></div>", "<div class=\"card\"><div class=\"h2\">🏢 Plano de Contas</div><p class=\"p\">Plano de Contas é a lista organizada das contas utilizadas pela empresa.</p><div class=\"box blue\">Ele muda conforme porte, ramo de atividade e necessidade dos usuários.</div></div>", "<div class=\"card\"><div class=\"h2\">💡 Exemplo de plano de contas</div><p class=\"p\">Uma multinacional precisa de contas mais detalhadas que uma pequena lanchonete.</p><div class=\"box blue\">Nexus Tech Log S/A: softwares, frotas, contratos globais. Lanchonete: caixa, estoques, fornecedores e vendas.</div></div>", "<div class=\"card\"><div class=\"h2\">🧠 Partes do Plano de Contas</div><p class=\"p\">O plano não é apenas uma lista de nomes. Ele orienta o funcionamento dos registros.</p><div class=\"box blue\">Elenco de Contas • Manual de Contas • Modelos de Demonstrações</div></div>", "<div class=\"card\"><div class=\"h2\">📌 Conta Contábil</div><p class=\"p\">Conta é o nome técnico dado aos elementos patrimoniais e de resultado.</p><div class=\"box blue\">Caixa • Estoques • Clientes • Fornecedores • Capital Social • Receita • Despesa</div></div>", "<div class=\"card\"><div class=\"h2\">💰 Caixa</div><p class=\"p\">Caixa representa dinheiro disponível fisicamente ou sob controle imediato da entidade.</p><div class=\"box blue\">Quando entra dinheiro, Caixa aumenta no débito.</div></div>", "<div class=\"card\"><div class=\"h2\">📦 Estoques</div><p class=\"p\">Estoques representam bens adquiridos ou produzidos para venda ou consumo.</p><div class=\"box blue\">Compra de mercadorias aumenta Estoques no débito.</div></div>", "<div class=\"card\"><div class=\"h2\">🤝 Fornecedores</div><p class=\"p\">Fornecedores representam obrigações com terceiros pela compra de bens ou serviços.</p><div class=\"box blue\">Compra a prazo aumenta Fornecedores no crédito.</div></div>", "<div class=\"card\"><div class=\"h2\">🏛️ Capital Social</div><p class=\"p\">Capital Social representa o investimento dos sócios na entidade.</p><div class=\"box blue\">Integralização de capital aumenta o PL no crédito.</div></div>", "<div class=\"card\"><div class=\"h2\">⚖️ Partidas Dobradas</div><p class=\"p\">Não existe débito sem crédito correspondente.</p><div class=\"box blue\">A soma dos débitos será sempre igual à soma dos créditos.</div></div>", "<div class=\"card\"><div class=\"h2\">👨‍🏫 Luca Pacioli</div><p class=\"p\">O método das partidas dobradas foi difundido por Luca Pacioli.</p><div class=\"box blue\">Também é conhecido como método veneziano.</div></div>", "<div class=\"card\"><div class=\"h2\">🔄 Débito e Crédito</div><p class=\"p\">Na Contabilidade, débito e crédito são lados do registro, não significam dívida ou dinheiro disponível.</p><div class=\"box blue\">Débito: lado esquerdo. Crédito: lado direito.</div></div>", "<div class=\"card\"><div class=\"h2\">🧠 Macete das naturezas</div><p class=\"p\">Para começar bem, memorize a natureza das contas.</p><div class=\"box blue\">Ativo e Despesa: devedoras. Passivo, PL e Receita: credoras.</div></div>", "<div class=\"card\"><div class=\"h2\">📈 Aumento e diminuição</div><p class=\"p\">As contas aumentam pelo lado da sua natureza.</p><div class=\"box blue\">Ativo aumenta no débito. Passivo aumenta no crédito.</div></div>", "<div class=\"card\"><div class=\"h2\">💰 Exemplo 1: capital</div><p class=\"p\">Sócios integralizam R$ 500.000 em dinheiro.</p><div class=\"formula\">D – Caixa 500.000 | C – Capital Social 500.000</div></div>", "<div class=\"card\"><div class=\"h2\">📦 Exemplo 2: compra a prazo</div><p class=\"p\">Compra de mercadorias para revenda no valor de R$ 120.000.</p><div class=\"formula\">D – Estoques 120.000 | C – Fornecedores 120.000</div></div>", "<div class=\"card\"><div class=\"h2\">🚚 Exemplo 3: veículo</div><p class=\"p\">Compra de caminhão por R$ 180.000: 40% à vista e 60% financiado.</p><div class=\"formula\">D – Veículos 180.000 | C – Caixa 72.000 | C – Financiamentos 108.000</div></div>", "<div class=\"card\"><div class=\"h2\">🧾 Exemplo 4: serviços</div><p class=\"p\">Prestação de serviços por R$ 90.000: R$ 35.000 à vista e R$ 55.000 a prazo.</p><div class=\"formula\">D – Caixa 35.000 | D – Clientes 55.000 | C – Receita de Serviços 90.000</div></div>", "<div class=\"card\"><div class=\"h2\">🔢 Fórmulas de lançamento</div><p class=\"p\">As fórmulas mostram quantas contas existem no débito e no crédito.</p><div class=\"formula\">Macete: 11, 12, 21, 22</div></div>", "<div class=\"card\"><div class=\"h2\">1️⃣ Primeira fórmula</div><p class=\"p\">Um débito e um crédito.</p><div class=\"formula\">Compra de estoque a prazo: D – Estoques 48.000 | C – Fornecedores 48.000</div></div>", "<div class=\"card\"><div class=\"h2\">2️⃣ Segunda fórmula</div><p class=\"p\">Um débito e dois ou mais créditos.</p><div class=\"formula\">D – Máquinas 300.000 | C – Bancos 100.000 | C – Financiamentos 200.000</div></div>", "<div class=\"card\"><div class=\"h2\">3️⃣ Terceira fórmula</div><p class=\"p\">Dois ou mais débitos e um crédito.</p><div class=\"formula\">D – Caixa 25.000 | D – Clientes 50.000 | C – Receita de Serviços 75.000</div></div>", "<div class=\"card\"><div class=\"h2\">4️⃣ Quarta fórmula</div><p class=\"p\">Dois ou mais débitos e dois ou mais créditos.</p><div class=\"formula\">D – Mercadorias 30.000 | D – Material 30.000 | C – Caixa 20.000 | C – Fornecedores 40.000</div></div>", "<div class=\"card\"><div class=\"h2\">📊 Fatos contábeis</div><p class=\"p\">Os fatos são classificados conforme o impacto sobre o Patrimônio Líquido.</p><div class=\"box blue\">Permutativo • Modificativo • Misto</div></div>", "<div class=\"card\"><div class=\"h2\">🔁 Fato permutativo</div><p class=\"p\">Altera a composição patrimonial, mas não altera o Patrimônio Líquido.</p><div class=\"box blue\">Compra de veículo à vista: troca Bancos por Veículos.</div></div>", "<div class=\"card\"><div class=\"h2\">📈 Modificativo aumentativo</div><p class=\"p\">Aumenta o Patrimônio Líquido por meio de receita.</p><div class=\"formula\">Receita de juros: D – Bancos 4.800 | C – Receita de Juros 4.800</div></div>", "<div class=\"card\"><div class=\"h2\">📉 Modificativo diminutivo</div><p class=\"p\">Diminui o Patrimônio Líquido por meio de despesa.</p><div class=\"formula\">Salários: D – Despesa de Salários 82.000 | C – Salários a Pagar 82.000</div></div>", "<div class=\"card\"><div class=\"h2\">🧩 Misto aumentativo</div><p class=\"p\">Tem permuta patrimonial e aumento do PL.</p><div class=\"box blue\">Dívida de R$ 40.000 paga com desconto de R$ 3.000.</div></div>", "<div class=\"card\"><div class=\"h2\">🧩 Misto diminutivo</div><p class=\"p\">Tem permuta patrimonial e redução do PL.</p><div class=\"box blue\">Dívida de R$ 50.000 paga com multa de R$ 2.500.</div></div>", "<div class=\"card\"><div class=\"h2\">🛠️ Retificação</div><p class=\"p\">Erro contábil não se corrige com rasura.</p><div class=\"box blue\">Formas técnicas: estorno, transferência e complementação.</div></div>", "<div class=\"card quiz\"><div class=\"h2\">✅ Quiz 1/14</div><p class=\"p big\">A escrituração deve ser feita:</p><button class=\"alt\" onclick=\"answer(this,false)\">A) Apenas em moeda estrangeira</button><button class=\"alt\" onclick=\"answer(this,true)\">B) Em idioma e moeda nacionais</button><button class=\"alt\" onclick=\"answer(this,false)\">C) Sem ordem cronológica</button><button class=\"alt\" onclick=\"answer(this,false)\">D) Com rasuras justificadas</button><div class=\"comment box green\"><b>Comentário:</b> A ITG 2000 exige idioma nacional, moeda nacional, forma contábil, ordem cronológica e ausência de rasuras.</div></div>", "<div class=\"card quiz\"><div class=\"h2\">✅ Quiz 2/14</div><p class=\"p big\">A palavra “exclusivamente” em documentos externos torna a alternativa:</p><button class=\"alt\" onclick=\"answer(this,false)\">A) Correta</button><button class=\"alt\" onclick=\"answer(this,false)\">B) Incompleta, mas correta</button><button class=\"alt\" onclick=\"answer(this,true)\">C) Errada</button><button class=\"alt\" onclick=\"answer(this,false)\">D) Obrigatória</button><div class=\"comment box green\"><b>Comentário:</b> A escrituração pode se basear em documentos externos, internos ou outros elementos comprobatórios.</div></div>", "<div class=\"card quiz\"><div class=\"h2\">✅ Quiz 3/14</div><p class=\"p big\">Plano de Contas é:</p><button class=\"alt\" onclick=\"answer(this,true)\">A) A lista organizada das contas da entidade</button><button class=\"alt\" onclick=\"answer(this,false)\">B) Apenas o Balanço Patrimonial</button><button class=\"alt\" onclick=\"answer(this,false)\">C) Somente o Livro Diário</button><button class=\"alt\" onclick=\"answer(this,false)\">D) Um relatório de auditoria</button><div class=\"comment box green\"><b>Comentário:</b> O plano de contas organiza as contas usadas pela entidade.</div></div>", "<div class=\"card quiz\"><div class=\"h2\">✅ Quiz 4/14</div><p class=\"p big\">Qual conta representa obrigação?</p><button class=\"alt\" onclick=\"answer(this,false)\">A) Caixa</button><button class=\"alt\" onclick=\"answer(this,false)\">B) Clientes</button><button class=\"alt\" onclick=\"answer(this,false)\">C) Estoques</button><button class=\"alt\" onclick=\"answer(this,true)\">D) Fornecedores</button><div class=\"comment box green\"><b>Comentário:</b> Fornecedores representa dívidas com terceiros.</div></div>", "<div class=\"card quiz\"><div class=\"h2\">✅ Quiz 5/14</div><p class=\"p big\">Ativo aumenta por:</p><button class=\"alt\" onclick=\"answer(this,false)\">A) Crédito</button><button class=\"alt\" onclick=\"answer(this,true)\">B) Débito</button><button class=\"alt\" onclick=\"answer(this,false)\">C) Estorno</button><button class=\"alt\" onclick=\"answer(this,false)\">D) Rasura</button><div class=\"comment box green\"><b>Comentário:</b> Contas do Ativo têm natureza devedora.</div></div>", "<div class=\"card quiz\"><div class=\"h2\">✅ Quiz 6/14</div><p class=\"p big\">Passivo aumenta por:</p><button class=\"alt\" onclick=\"answer(this,false)\">A) Débito</button><button class=\"alt\" onclick=\"answer(this,true)\">B) Crédito</button><button class=\"alt\" onclick=\"answer(this,false)\">C) Despesa</button><button class=\"alt\" onclick=\"answer(this,false)\">D) Estorno</button><div class=\"comment box green\"><b>Comentário:</b> Contas do Passivo têm natureza credora.</div></div>", "<div class=\"card quiz\"><div class=\"h2\">✅ Quiz 7/14</div><p class=\"p big\">Receita possui natureza:</p><button class=\"alt\" onclick=\"answer(this,false)\">A) Devedora</button><button class=\"alt\" onclick=\"answer(this,true)\">B) Credora</button><button class=\"alt\" onclick=\"answer(this,false)\">C) Nula</button><button class=\"alt\" onclick=\"answer(this,false)\">D) Retificadora do ativo</button><div class=\"comment box green\"><b>Comentário:</b> Receitas aumentam o Patrimônio Líquido e possuem natureza credora.</div></div>", "<div class=\"card quiz\"><div class=\"h2\">✅ Quiz 8/14</div><p class=\"p big\">Compra de mercadorias a prazo gera:</p><button class=\"alt\" onclick=\"answer(this,true)\">A) D – Estoques / C – Fornecedores</button><button class=\"alt\" onclick=\"answer(this,false)\">B) D – Fornecedores / C – Estoques</button><button class=\"alt\" onclick=\"answer(this,false)\">C) D – Receita / C – Caixa</button><button class=\"alt\" onclick=\"answer(this,false)\">D) D – Caixa / C – Capital</button><div class=\"comment box green\"><b>Comentário:</b> Entram estoques e nasce uma obrigação.</div></div>", "<div class=\"card quiz\"><div class=\"h2\">✅ Quiz 9/14</div><p class=\"p big\">Um lançamento com 1 débito e 2 créditos é:</p><button class=\"alt\" onclick=\"answer(this,false)\">A) 1ª fórmula</button><button class=\"alt\" onclick=\"answer(this,true)\">B) 2ª fórmula</button><button class=\"alt\" onclick=\"answer(this,false)\">C) 3ª fórmula</button><button class=\"alt\" onclick=\"answer(this,false)\">D) 4ª fórmula</button><div class=\"comment box green\"><b>Comentário:</b> Segunda fórmula = 1 débito e 2 ou mais créditos.</div></div>", "<div class=\"card quiz\"><div class=\"h2\">✅ Quiz 10/14</div><p class=\"p big\">Um lançamento com 2 débitos e 1 crédito é:</p><button class=\"alt\" onclick=\"answer(this,false)\">A) 1ª fórmula</button><button class=\"alt\" onclick=\"answer(this,false)\">B) 2ª fórmula</button><button class=\"alt\" onclick=\"answer(this,true)\">C) 3ª fórmula</button><button class=\"alt\" onclick=\"answer(this,false)\">D) 4ª fórmula</button><div class=\"comment box green\"><b>Comentário:</b> Terceira fórmula = 2 ou mais débitos e 1 crédito.</div></div>", "<div class=\"card quiz\"><div class=\"h2\">✅ Quiz 11/14</div><p class=\"p big\">Compra de veículo à vista é fato:</p><button class=\"alt\" onclick=\"answer(this,true)\">A) Permutativo</button><button class=\"alt\" onclick=\"answer(this,false)\">B) Modificativo aumentativo</button><button class=\"alt\" onclick=\"answer(this,false)\">C) Modificativo diminutivo</button><button class=\"alt\" onclick=\"answer(this,false)\">D) Misto diminutivo</button><div class=\"comment box green\"><b>Comentário:</b> Troca um ativo por outro ativo, sem alterar o PL.</div></div>", "<div class=\"card quiz\"><div class=\"h2\">✅ Quiz 12/14</div><p class=\"p big\">Recebimento de receita de juros é fato:</p><button class=\"alt\" onclick=\"answer(this,false)\">A) Permutativo</button><button class=\"alt\" onclick=\"answer(this,true)\">B) Modificativo aumentativo</button><button class=\"alt\" onclick=\"answer(this,false)\">C) Misto diminutivo</button><button class=\"alt\" onclick=\"answer(this,false)\">D) Retificação</button><div class=\"comment box green\"><b>Comentário:</b> Receita aumenta o Patrimônio Líquido.</div></div>", "<div class=\"card quiz\"><div class=\"h2\">✅ Quiz 13/14</div><p class=\"p big\">Pagamento de dívida com multa é fato:</p><button class=\"alt\" onclick=\"answer(this,false)\">A) Permutativo puro</button><button class=\"alt\" onclick=\"answer(this,true)\">B) Misto diminutivo</button><button class=\"alt\" onclick=\"answer(this,false)\">C) Modificativo aumentativo</button><button class=\"alt\" onclick=\"answer(this,false)\">D) Superveniência ativa</button><div class=\"comment box green\"><b>Comentário:</b> Há baixa de obrigação, saída de dinheiro e reconhecimento de despesa.</div></div>", "<div class=\"card quiz\"><div class=\"h2\">✅ Quiz 14/14</div><p class=\"p big\">Lançamento inverso para anular erro chama-se:</p><button class=\"alt\" onclick=\"answer(this,false)\">A) Transferência</button><button class=\"alt\" onclick=\"answer(this,false)\">B) Complementação</button><button class=\"alt\" onclick=\"answer(this,true)\">C) Estorno</button><button class=\"alt\" onclick=\"answer(this,false)\">D) Balancete</button><div class=\"comment box green\"><b>Comentário:</b> Estorno é o lançamento inverso que anula o registro incorreto.</div></div>", "<div class=\"card\"><div class=\"emoji\">🏆</div><div class=\"h1\">Parabéns!</div><p class=\"p big\">Você concluiu as 50 telas da trilha.</p><div class=\"box yellow\"><b>Revisão final:</b><br>✅ Débitos = Créditos<br>✅ Ativo e Despesa aumentam no débito<br>✅ Passivo, PL e Receita aumentam no crédito<br>✅ Fórmulas: 11, 12, 21, 22<br>✅ Permutativo não altera o PL</div><button class=\"btn full\" onclick=\"sendConclusion()\">📤 Enviar conclusão ao professor</button><button class=\"btn3 full\" onclick=\"restart()\">🔄 Estudar novamente</button></div>"];
let current=Number(localStorage.getItem('trilha_escrituracao_slide')||0);
if(current<0||current>=slides.length) current=0;
function render(){document.getElementById('slides').innerHTML=slides.map((h,i)=>`<section class="screen ${i===current?'active':''}">${h}</section>`).join(''); update();}
function update(){document.querySelectorAll('.screen').forEach((el,i)=>el.classList.toggle('active',i===current));document.getElementById('counter').textContent=`Tela ${current+1}/${slides.length}`;document.getElementById('bar').style.width=((current+1)/slides.length*100)+'%';localStorage.setItem('trilha_escrituracao_slide',current);window.scrollTo(0,0);}
function nextSlide(){if(current<slides.length-1){current++;update();}}
function prevSlide(){if(current>0){current--;update();}}
function home(){current=0;update();}
function restart(){localStorage.removeItem('trilha_escrituracao_slide');current=0;render();}
function startCourse(){const nome=document.getElementById('student')?.value.trim()||'Aluno';localStorage.setItem('trilha_escrituracao_nome',nome);current=1;update();}
function continueCourse(){current=Number(localStorage.getItem('trilha_escrituracao_slide')||1);update();}
function answer(btn,ok){const box=btn.closest('.quiz');box.querySelectorAll('.alt').forEach(b=>b.disabled=true);if(ok){btn.classList.add('correct');}else{btn.classList.add('wrong');const correct=[...box.querySelectorAll('.alt')].find(a=>a.getAttribute('onclick').includes('true'));if(correct)correct.classList.add('correct');}box.querySelector('.comment').classList.add('show');}
function sendConclusion(){const nome=localStorage.getItem('trilha_escrituracao_nome')||'Aluno';const msg=encodeURIComponent(`Professor Moreira, eu (${nome}) concluí as 50 telas da trilha de Escrituração, Plano de Contas e Partidas Dobradas.`);window.open(`https://wa.me/${whatsapp}?text=${msg}`,'_blank');}
render();
</script></body></html>
